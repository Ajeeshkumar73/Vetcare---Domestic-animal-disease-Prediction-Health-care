{% extends 'base.html' %}

{% block title %}Add Vaccination Reminder - VetCare{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto">
    <div class="mb-4">
        <a href="{% url 'reminder_list' %}" class="text-xs font-semibold text-gray-600 hover:text-blue-600 flex items-center gap-1">
            <span class="material-symbols-outlined text-sm">arrow_back</span> Back to Reminders
        </a>
        <h1 class="text-2xl font-bold text-gray-900 mt-2">Add Vaccination / Health Reminder</h1>
    </div>

    <div class="bg-white border border-gray-200 rounded-xl p-6 shadow-sm">
        <form method="POST" class="space-y-4">
            {% csrf_token %}

            <div>
                <label class="block text-xs font-semibold text-gray-900 mb-1">Select Pet *</label>
                <select name="pet_id" required class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-xs font-semibold text-gray-900">
                    {% for p in pets %}
                        <option value="{{ p.id }}">{{ p.name }} ({{ p.species }} - {{ p.breed }})</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-900 mb-1">Vaccine Name / Task Title *</label>
                <input type="text" name="vaccine_name" required placeholder="e.g. Rabies Core Shot, DHPP Booster, Deworming" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-xs text-gray-900 outline-none focus:border-blue-600 focus:bg-white transition-all">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-900 mb-1">Due Date *</label>
                    <input type="date" name="due_date" required class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-xs text-gray-900 outline-none focus:border-blue-600 focus:bg-white transition-all">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-900 mb-1">Recurring Schedule</label>
                    <select name="recurring_months" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-xs font-semibold text-gray-900">
                        <option value="0">One-Time Only</option>
                        <option value="3">Every 3 Months (Deworming)</option>
                        <option value="6">Every 6 Months (Checkup)</option>
                        <option value="12">Every 12 Months (Annual Core Shot)</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-900 mb-1">Clinical Notes (Optional)</label>
                <textarea name="notes" rows="3" placeholder="e.g. Administer with meal, Dr. Smith clinic..." class="w-full bg-gray-50 border border-gray-200 rounded-lg p-3 text-xs text-gray-900 outline-none focus:border-blue-600 focus:bg-white transition-all"></textarea>
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white font-semibold text-xs py-3 rounded-lg hover:opacity-90 transition-opacity flex items-center justify-center gap-2">
                <span class="material-symbols-outlined text-sm">event_available</span> Save Reminder Schedule
            </button>
        </form>
    </div>
</div>
{% endblock %}
