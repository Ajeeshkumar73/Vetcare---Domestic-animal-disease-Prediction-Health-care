{% extends 'base.html' %}

{% block title %}Reset Password - VetCare{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-8">
    <div class="bg-white border border-gray-200 rounded-xl p-8 shadow-sm">
        <div class="text-center mb-6">
            <div class="w-12 h-12 rounded-xl bg-gray-50 border border-gray-200 text-blue-600 flex items-center justify-center mx-auto mb-3">
                <span class="material-symbols-outlined text-2xl">key</span>
            </div>
            <h2 class="text-2xl font-bold text-gray-900">Reset Password</h2>
            <p class="text-xs text-gray-600 mt-1">Specify your registered account email and set a new password.</p>
        </div>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-semibold text-gray-900 mb-1">Registered Email</label>
                <input type="email" name="email" required placeholder="user@example.com" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3.5 py-2.5 text-xs text-gray-900 outline-none focus:border-blue-600 transition-all">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-900 mb-1">New Password</label>
                <input type="password" name="new_password" required placeholder="Enter new password" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3.5 py-2.5 text-xs text-gray-900 outline-none focus:border-blue-600 transition-all">
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white font-semibold text-xs py-3 rounded-lg hover:opacity-90 transition-opacity flex items-center justify-center gap-1.5">
                <span class="material-symbols-outlined text-sm">published_with_changes</span> Update Password
            </button>
        </form>

        <div class="mt-6 pt-4 border-t border-gray-200 text-center text-xs text-gray-600">
            Remembered your password? <a href="{% url 'login' %}" class="font-bold text-blue-600 hover:underline">Back to Sign In</a>
        </div>
    </div>
</div>
{% endblock %}
