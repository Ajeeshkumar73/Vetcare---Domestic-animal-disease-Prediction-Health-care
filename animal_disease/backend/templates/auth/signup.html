{% extends 'base.html' %}

{% block title %}Create Account - VetCare{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto my-8">
    <div class="bg-white border border-gray-200 rounded-xl p-8 shadow-sm">
        <div class="text-center mb-6">
            <div class="w-12 h-12 rounded-xl bg-gray-50 border border-gray-200 text-blue-600 flex items-center justify-center mx-auto mb-3">
                <span class="material-symbols-outlined text-2xl">person_add</span>
            </div>
            <h2 class="text-2xl font-bold text-gray-900">Register Account</h2>
            <p class="text-xs text-gray-600 mt-1">Create your VetCare profile to access pet health records and AI diagnostics.</p>
        </div>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-900 mb-1">Username *</label>
                    <input type="text" name="username" required placeholder="johndoe" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3.5 py-2 text-xs text-gray-900 outline-none focus:border-blue-600 transition-all">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-900 mb-1">Account Role</label>
                    <select name="role" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3.5 py-2 text-xs font-semibold text-gray-900">
                        <option value="pet_owner">Pet Owner</option>
                        <option value="veterinarian">Veterinarian / Admin</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-900 mb-1">Email Address *</label>
                <input type="email" name="email" required placeholder="user@example.com" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3.5 py-2 text-xs text-gray-900 outline-none focus:border-blue-600 transition-all">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-900 mb-1">Phone Number (Optional)</label>
                <input type="text" name="phone" placeholder="+1 (555) 000-0000" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3.5 py-2 text-xs text-gray-900 outline-none">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-900 mb-1">Password *</label>
                    <input type="password" name="password" required placeholder="••••••••" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3.5 py-2 text-xs text-gray-900 outline-none focus:border-blue-600 transition-all">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-900 mb-1">Confirm Password *</label>
                    <input type="password" name="confirm_password" required placeholder="••••••••" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3.5 py-2 text-xs text-gray-900 outline-none focus:border-blue-600 transition-all">
                </div>
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white font-semibold text-xs py-3 rounded-lg hover:opacity-90 transition-opacity flex items-center justify-center gap-1.5">
                <span class="material-symbols-outlined text-sm">how_to_reg</span> Register Account
            </button>
        </form>

        <div class="mt-6 pt-4 border-t border-gray-200 text-center text-xs text-gray-600">
            Already registered? <a href="{% url 'login' %}" class="font-bold text-blue-600 hover:underline">Sign in here</a>
        </div>
    </div>
</div>
{% endblock %}
