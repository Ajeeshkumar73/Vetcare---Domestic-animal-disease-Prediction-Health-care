{% extends 'base.html' %}

{% block title %}{{ title }} - VetCare{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto">
    <div class="mb-4">
        <a href="{% url 'pet_list' %}" class="text-xs font-semibold text-gray-600 hover:text-blue-600 flex items-center gap-1">
            <span class="material-symbols-outlined text-sm">arrow_back</span> Back to Pet Profiles
        </a>
        <h1 class="text-2xl font-bold text-gray-900 mt-2">{{ title }}</h1>
    </div>

    <div class="bg-white border border-gray-200 rounded-xl p-6 shadow-sm">
        <form method="POST" enctype="multipart/form-data" class="space-y-4">
            {% csrf_token %}

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-900 mb-1">Pet Name *</label>
                    <input type="text" name="name" value="{{ pet.name|default:'' }}" required placeholder="e.g. Buddy, Max, Bella" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-xs text-gray-900 outline-none focus:border-blue-600 focus:bg-white transition-all">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-900 mb-1">Species *</label>
                    <select name="species" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-xs font-semibold text-gray-900">
                        <option value="Dog" {% if pet.species == 'Dog' %}selected{% endif %}>Dog</option>
                        <option value="Cat" {% if pet.species == 'Cat' %}selected{% endif %}>Cat</option>
                        <option value="Bird" {% if pet.species == 'Bird' %}selected{% endif %}>Bird</option>
                        <option value="Cattle" {% if pet.species == 'Cattle' %}selected{% endif %}>Cattle / Cow / Buffalo</option>
                        <option value="Horse" {% if pet.species == 'Horse' %}selected{% endif %}>Horse</option>
                        <option value="Rabbit" {% if pet.species == 'Rabbit' %}selected{% endif %}>Rabbit</option>
                        <option value="Goat" {% if pet.species == 'Goat' %}selected{% endif %}>Goat / Sheep</option>
                        <option value="Other" {% if pet.species == 'Other' %}selected{% endif %}>Other Animal</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-900 mb-1">Breed</label>
                    <input type="text" name="breed" value="{{ pet.breed|default:'' }}" placeholder="e.g. Golden Retriever, Mixed" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-xs text-gray-900 outline-none focus:border-blue-600 focus:bg-white transition-all">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-900 mb-1">Gender</label>
                    <select name="gender" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-xs font-semibold text-gray-900">
                        <option value="Male" {% if pet.gender == 'Male' %}selected{% endif %}>Male</option>
                        <option value="Female" {% if pet.gender == 'Female' %}selected{% endif %}>Female</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-3 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-900 mb-1">Age (Years)</label>
                    <input type="number" name="age_years" value="{{ pet.age_years|default:0 }}" min="0" max="40" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-xs text-gray-900 outline-none">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-900 mb-1">Age (Months)</label>
                    <input type="number" name="age_months" value="{{ pet.age_months|default:0 }}" min="0" max="11" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-xs text-gray-900 outline-none">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-900 mb-1">Weight (kg)</label>
                    <input type="number" step="0.1" name="weight_kg" value="{{ pet.weight_kg|default:0.0 }}" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-xs text-gray-900 outline-none">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-900 mb-1">Microchip ID (Optional)</label>
                <input type="text" name="microchip_id" value="{{ pet.microchip_id|default:'' }}" placeholder="985141000000000" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-xs text-gray-900 outline-none">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-900 mb-1">Pet Photo</label>
                <input type="file" name="photo" accept="image/*" class="w-full bg-gray-50 border border-dashed border-gray-200 rounded-lg p-2 text-xs">
                {% if pet.photo %}
                    <p class="text-[11px] text-blue-600 font-semibold mt-1">Current file: {{ pet.photo.name }}</p>
                {% endif %}
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-900 mb-1">Special Clinical Notes &amp; Allergies</label>
                <textarea name="notes" rows="3" placeholder="e.g. Allergic to penicillin..." class="w-full bg-gray-50 border border-gray-200 rounded-lg p-3 text-xs text-gray-900 outline-none"></textarea>
            </div>

            <div class="flex gap-3 pt-2">
                <button type="submit" class="flex-grow bg-blue-600 text-white font-semibold text-xs py-3 rounded-lg hover:opacity-90 transition-opacity flex items-center justify-center gap-1.5">
                    <span class="material-symbols-outlined text-sm">save</span> Save Pet Profile
                </button>
                <a href="{% url 'pet_list' %}" class="bg-gray-50 border border-gray-200 text-gray-900 px-5 py-3 rounded-lg text-xs font-semibold hover:bg-gray-100">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
