{% extends 'base.html' %}

{% block title %}Add Health Record - VetCare{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto">
    <div class="mb-4">
        <a href="{% url 'health_record_list' %}" class="text-xs font-semibold text-gray-600 hover:text-blue-600 flex items-center gap-1">
            <span class="material-symbols-outlined text-sm">arrow_back</span> Back to Health Records
        </a>
        <h1 class="text-2xl font-bold text-gray-900 mt-2">Add / Upload Health Record</h1>
    </div>

    <div class="bg-white border border-gray-200 rounded-xl p-6 shadow-sm">
        <form method="POST" enctype="multipart/form-data" class="space-y-4">
            {% csrf_token %}

            <div>
                <label class="block text-xs font-semibold text-gray-900 mb-1">Select Pet *</label>
                <select name="pet_id" required class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-xs font-semibold text-gray-900">
                    {% for p in pets %}
                        <option value="{{ p.id }}">{{ p.name }} ({{ p.species }} - {{ p.breed }})</option>
                    {% endfor %}
                </select>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-900 mb-1">Record Category *</label>
                    <select name="record_type" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-xs font-semibold text-gray-900">
                        <option value="vet_visit">Vet Visit Note</option>
                        <option value="prescription">Prescription / Medication</option>
                        <option value="lab_report">Lab / Test Report</option>
                        <option value="vaccination">Vaccination Proof</option>
                        <option value="weight_entry">Weight Log</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-900 mb-1">Record Date *</label>
                    <input type="date" name="record_date" required class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-xs text-gray-900 outline-none focus:border-blue-600 transition-all">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-900 mb-1">Record Title *</label>
                <input type="text" name="title" required placeholder="e.g. Physical Exam, Blood Test Report" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-xs text-gray-900 outline-none focus:border-blue-600 transition-all">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-900 mb-1">Description &amp; Clinical Notes</label>
                <textarea name="description" rows="4" placeholder="Enter clinical notes, dosage, diagnostic findings..." class="w-full bg-gray-50 border border-gray-200 rounded-lg p-3 text-xs text-gray-900 outline-none focus:border-blue-600 transition-all"></textarea>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-900 mb-1">Upload File / Document (Optional)</label>
                <input type="file" name="attachment" class="w-full bg-gray-50 border border-dashed border-gray-200 rounded-lg p-2 text-xs">
                <p class="text-[11px] text-gray-600 mt-1">Supports PDF, JPG, PNG, DOCX</p>
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white font-semibold text-xs py-3 rounded-lg hover:opacity-90 transition-opacity flex items-center justify-center gap-2">
                <span class="material-symbols-outlined text-sm">cloud_upload</span> Save Health Record
            </button>
        </form>
    </div>
</div>
{% endblock %}
